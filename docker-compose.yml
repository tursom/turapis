services:
  turapis:
    build: .
    image: ghcr.io/tursom/turapis:latest
    container_name: turapis
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
    command:
      - "-addr"
      - ":8080"
      - "-db"
      - "/data/turapis.db"
      - "-static-dir"
      - "/static"
      - "-log-file"
      - "/data/turapis.log"
